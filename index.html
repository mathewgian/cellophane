<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Summary</title>
    <style>
      :root {
        --bg: #1f1f1f;
        --panel: #f4f4f4;
        --header-green: #3d9f5b;
        --header-dark: #2a2a2a;
        --text: #1f1f1f;
        --muted: #dfe8ec;
        --soft: #ebebeb;
        --outline: #6dbb82;
        --shadow: rgba(0, 0, 0, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .app {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        background: #ffffff;
        padding-bottom: 76px;
      }

      .banner {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .banner-row {
        width: 100%;
        padding: 10px 16px 12px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .banner-row.white {
        background: #ffffff;
        color: #000000;
        justify-content: space-between;
      }

      .banner-row.green {
        background: linear-gradient(90deg, #2e9a58, #3eaf62);
        color: #ffffff;
        width: calc(100% - 20px);
        margin: 0 auto;
        border-radius: 10px;
      }

      .banner-title {
        font-size: 30px;
        line-height: 1.1;
      }

      .banner-subtitle {
        font-size: 30px;
        line-height: 1.1;
        font-weight: 700;
        color: #ffffff;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        align-items: center;
        gap: 18px;
        padding: 14px;
        background: #ffffff;
      }

      .donut-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 260px;
        height: 260px;
        flex: 0 0 260px;
        min-width: 260px;
        min-height: 260px;
      }

      .guideline-pie {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.28;
      }
      .guideline-pie.hidden { display: none; }
      .guideline-pie path { cursor: help; transition: opacity 120ms ease; }
      .guideline-pie path:hover,
      .guideline-pie path:focus { opacity: 0.8; outline: none; }

      .guidelines-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
        color: #2c2c2c;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .guidelines-toggle input { width: 16px; height: 16px; accent-color: #3d9f5b; }

      .summary-values {
        display: grid;
        gap: 12px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: #2f2f2f;
        font-weight: 700;
      }

      .summary-row .label {
        font-size: 17px;
        font-weight: 700;
        color: #2c2c2c;
      }

      .summary-row .value {
        font-size: 16px;
        color: #1d1d1d;
        text-align: right;
        min-width: 140px;
      }

      .section {
        margin-top: 0;
        background: #ffffff;
      }

      .section-header {
        background: var(--header-green);
        color: white;
        padding: 12px 16px;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: 0.02em;
        width: calc(100% - 20px);
        margin: 0 auto;
        border-radius: 10px;
      }

      .entry-list {
        padding: 0 0 12px;
      }

      .add-transaction-button {
        position: fixed;
        z-index: 11;
        right: max(20px, calc((100vw - 620px) / 2 + 20px));
        bottom: 78px;
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 12px;
        background: #b9e8c3;
        color: #245b32;
        font-size: 36px;
        line-height: 1;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }

      .add-transaction-button:hover,
      .add-transaction-button:focus-visible,
      .save-transaction-button:hover,
      .save-transaction-button:focus-visible {
        background: #9bd9a9;
        outline: 2px solid #3d9f5b;
      }

      .category-accordion { background: #fff; margin-top: 6px; }

      .spreadsheet-content {
        transition: filter 280ms ease, opacity 280ms ease;
        filter: blur(0);
        opacity: 1;
      }
      #app.transaction-open .spreadsheet-content {
        filter: blur(5px);
        opacity: 0.72;
      }

      .category-summary { cursor: pointer; list-style: none; grid-template-columns: 1fr 1fr 14px; }
      .category-summary::-webkit-details-marker { display: none; }
      .category-summary > span:first-of-type { grid-column: 1; }
      .category-summary > .amount { grid-column: 2; min-width: 0; text-align: left; }
      .category-summary::before {
        content: '';
        grid-column: 3;
        grid-row: 1;
        justify-self: center;
        align-self: center;
        width: 8px;
        height: 8px;
        border-right: 2px solid #3d9f5b;
        border-bottom: 2px solid #3d9f5b;
        transform: rotate(-45deg);
        transition: transform 150ms ease;
      }
      .category-accordion[open] .category-summary::before { transform: rotate(45deg); }

      .transaction-list { padding: 0 16px 10px 42px; }
      .transaction-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid #e8eee9;
        font-size: 14px;
      }
      .empty-transactions { padding: 8px 0; color: #747474; font-size: 13px; }

      .transaction-page {
        position: fixed;
        z-index: 12;
        top: 20px;
        right: max(20px, calc((100vw - 620px) / 2 + 20px));
        bottom: 78px;
        width: min(50vw, 310px);
        overflow-y: auto;
        padding: 16px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.24);
        transform-origin: right bottom;
        animation: transaction-bubble-expand 280ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }
      .transaction-backdrop {
        position: fixed;
        z-index: 11;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: default;
      }
      @keyframes transaction-bubble-expand {
        from { opacity: 0; transform: scale(0.08); }
        to { opacity: 1; transform: scale(1); }
      }
      .transaction-page-heading { display: flex; align-items: center; gap: 16px; }
      .transaction-page-heading h1 { margin: 0; font-size: 25px; }
      .back-button {
        display: grid;
        flex: 0 0 24px;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .back-button::before {
        content: '';
        width: 8px;
        height: 8px;
        border-right: 2px solid #3d9f5b;
        border-bottom: 2px solid #3d9f5b;
        transform: rotate(135deg);
      }
      .back-button:focus-visible { outline: 2px solid #6dbb82; border-radius: 4px; }
      .transaction-form { display: grid; gap: 18px; margin-top: 28px; }
      .transaction-form label { display: grid; gap: 8px; font-weight: 700; }
      .transaction-form input,
      .transaction-form select {
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid #cbd8ce;
        border-radius: 6px;
        background: #fff;
        color: #1f1f1f;
        font: inherit;
      }
      .save-transaction-button {
        min-height: 46px;
        border: 0;
        border-radius: 7px;
        background: #b9e8c3;
        color: #245b32;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .entry-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 10px 16px 8px;
        font-size: 15px;
        font-weight: 700;
        color: #1a1a1a;
      }

      .entry-row:nth-child(odd) {
        background: rgba(255,255,255,0.12);
      }

      .entry-row .amount {
        min-width: 120px;
        text-align: right;
        color: #1a1a1a;
      }

      .entry-row .amount.negative {
        color: #b33a34;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr 120px;
        align-items: center;
        gap: 10px;
      }

      .input-row input {
        width: 100%;
        border: 1px solid rgba(0,0,0,0.14);
        background: #fff;
        color: #1a1a1a;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        text-align: right;
        padding: 6px 8px;
      }

      .bottom-toolbar {
        position: fixed;
        z-index: 10;
        right: 0;
        bottom: 0;
        left: 50%;
        display: flex;
        align-items: stretch;
        width: min(620px, 100%);
        min-height: 58px;
        overflow: hidden;
        transform: translateX(-50%);
        background: #2a2a2a;
        box-shadow: 0 -4px 14px var(--shadow);
      }

      .sheet-tab {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      .sheet-tabs {
        display: flex;
        flex: 1;
        gap: 6px;
        min-width: 0;
        padding: 8px 10px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .sheet-tab {
        flex: 0 0 auto;
        min-width: 100px;
        padding: 0 16px;
        border-radius: 6px;
        background: #454545;
        color: #dfe8ec;
        font-size: 14px;
        font-weight: 700;
      }

      .sheet-tab.active {
        background: #ffffff;
        color: #1f1f1f;
      }

      .sheet-tab:hover,
      .sheet-tab:focus-visible {
        outline: 2px solid #6dbb82;
        outline-offset: -2px;
      }

      svg {
        width: 260px;
        height: 260px;
        min-width: 260px;
        min-height: 260px;
        flex: 0 0 260px;
        display: block;
        overflow: visible;
      }

      @media (max-width: 560px) {
        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>
    <script src="./dist/cellophane.js"></script>
  </body>
</html>
